
name: Build OS Store APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o OSStoreLauncher-CloudBuild-Ready.zip -d build-src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p build-src/OSStoreLauncher :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OSStore-APK
          path: build-src/OSStoreLauncher/app/build/outputs/apk/debug/app-debug.apk
          
