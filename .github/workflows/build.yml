 
name: Build OS Store APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o OSStoreLauncher-CloudBuild-Ready.zip -d build-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        id: project
        run: |
          FILE=$(find build-src -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "Android project not found"
            find build-src -maxdepth 5 -type f
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set Java 17 targets
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              addition = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              s = s.replace("android {", "android {\n" + addition, 1)
              p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OSStore-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
